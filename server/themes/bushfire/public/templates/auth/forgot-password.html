<div class="row login-panel-row" style="padding-top: 20px"><div class="col-xs-12 login-panel">
  <h4>Password reset</h4><hr>
  <p>Enter your account email address or username. If the account can receive email, we’ll send a link valid for 30 minutes.</p>
  <div class="alert alert-success" ng-if="sent">{{message}}</div>
  <div class="alert alert-danger" ng-if="error">{{error}}</div>
  <form ng-if="!sent" ng-submit="submit()">
    <div class="form-group"><label for="reset-identity">Email or username</label><input class="form-control" id="reset-identity" ng-model="form.identity" autocomplete="username" required></div>
    <button class="btn btn-primary" type="submit" ng-disabled="loading">{{loading ? 'Sending…' : 'Send reset link'}}</button>
  </form>
  <p style="margin-top: 12px"><a href="/auth/login">Back to sign in</a></p>
</div></div>
