<div class="row" style="padding-top:30px"><div class="col-sm-6 col-sm-offset-3"><div class="panel panel-default"><div class="panel-heading"><strong><i class="fa fa-shield"></i> Administrator verification</strong></div><div class="panel-body"><p>Enter the six-digit code from your authenticator app, or one unused recovery code.</p><div class="alert alert-danger" ng-if="message">{{message}}</div><form ng-submit="verify()"><div class="form-group"><label>Authentication code</label><input class="form-control input-lg" ng-model="twoFactor.code" autocomplete="one-time-code" inputmode="numeric" autofocus required></div><label><input type="checkbox" ng-model="twoFactor.remember"> Remember this device</label><br><br><button class="btn btn-primary btn-lg" type="submit">Verify</button></form></div></div></div></div>
