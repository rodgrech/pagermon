<div class="row login-panel-row" style="padding-top: 20px"><div class="col-xs-12 login-panel">
  <h4>Choose a new password</h4><hr>
  <div class="alert alert-success" ng-if="done">{{message}}</div>
  <div class="alert alert-danger" ng-if="error">{{error}}</div>
  <form ng-if="!done" ng-submit="submit()">
    <div class="form-group"><label for="new-password">New password</label><input class="form-control" id="new-password" type="password" ng-model="form.password" minlength="12" maxlength="128" autocomplete="new-password" required><small>At least 12 characters.</small></div>
    <div class="form-group"><label for="confirm-new-password">Confirm password</label><input class="form-control" id="confirm-new-password" type="password" ng-model="form.confirmPassword" autocomplete="new-password" required></div>
    <button class="btn btn-primary" type="submit" ng-disabled="loading">{{loading ? 'Updating…' : 'Reset password'}}</button>
  </form>
  <p style="margin-top: 12px"><a href="/auth/login">Back to sign in</a></p>
</div></div>
